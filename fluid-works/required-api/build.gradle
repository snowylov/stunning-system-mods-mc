plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "liquid-fabric-api-unofficial-fabric-api" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

sourceSets {
    main {
        java {
            include "dev/liquidfabric/api/unofficial/UtilityApiMod.java"
            include "dev/liquidfabric/api/unofficial/api/block/BlockFluidContainerDefinition.java"
            include "dev/liquidfabric/api/unofficial/api/block/BlockFluidContainerRegistry.java"
            include "dev/liquidfabric/api/unofficial/api/block/FluidStorageBlockEntity.java"
            include "dev/liquidfabric/api/unofficial/api/container/CustomFluidContainerItemRegistry.java"
            include "dev/liquidfabric/api/unofficial/api/container/FluidContainerDefinition.java"
            include "dev/liquidfabric/api/unofficial/api/container/FluidContainerItem.java"
            include "dev/liquidfabric/api/unofficial/api/transfer/FluidTransferHelper.java"
            include "dev/liquidfabric/api/unofficial/core/FluidOverlayItem.java"
            include "dev/liquidfabric/api/unofficial/core/FluidUnits.java"
            include "dev/liquidfabric/api/unofficial/core/ModComponents.java"
            include "dev/liquidfabric/api/unofficial/core/SourceFluidAttributes.java"
            include "dev/liquidfabric/api/unofficial/core/StoredFluidComponent.java"
            include "dev/liquidfabric/api/unofficial/core/UtilityApiRegistries.java"
            include "dev/liquidfabric/api/unofficial/helper/item/FluidItemComponentHelper.java"
            include "dev/liquidfabric/api/unofficial/tank/common/UtilityFluidStorage.java"
        }
        resources {
            include "fabric.mod.json"
            include "pack.mcmeta"
        }
    }
    client {
        java {
            include "dev/liquidfabric/api/unofficial/client/UtilityApiClient.java"
        }
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
