name: Build Fluid Works

on:
  workflow_dispatch:
    inputs:
      export_jars:
        description: "Build and upload release JARs"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Fluid Works
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew required-api/gradlew

      - name: Compile independent Easy Containers API
        working-directory: required-api
        run: ./gradlew classes remapJar --no-daemon --parallel --build-cache

      - name: Install required API without embedding it
        run: cp required-api/build/libs/fabric-fluid-api-1.3.0.jar libs/fabric-fluid-api-1.3.0.jar

      - name: Fast source compile
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.export_jars }}
        run: ./gradlew classes --no-daemon --parallel --build-cache

      - name: Build release JARs
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.export_jars }}
        run: ./gradlew build --no-daemon --parallel --build-cache

      - name: Upload independent artifacts
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.export_jars }}
        uses: actions/upload-artifact@v4
        with:
          name: fluid-works-1.21.11
          path: |
            build/libs/fluid-works-*.jar
            required-api/build/libs/fabric-fluid-api-*.jar
