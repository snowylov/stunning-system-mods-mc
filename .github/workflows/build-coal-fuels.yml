name: Build Coal Fuels

on:
  push:
    branches:
      - bricks-and-coal-santas-tricks
    paths-ignore:
      - 'releases/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source
        shell: bash
        run: |
          cat coal-fuels-upload/source.tar.xz.b64.part-* | base64 -d > coal-fuels-full.tar.xz
          tar -xJf coal-fuels-full.tar.xz
          sed -i 's/import net.minecraft.state.property.DirectionProperty;/import net.minecraft.state.property.EnumProperty;/' coal-fuels-fabric-1.21.11/src/main/java/com/alex/coalfuels/GlowstoneWireBlock.java
          sed -i 's/public static final DirectionProperty FACING/public static final EnumProperty<Direction> FACING/' coal-fuels-fabric-1.21.11/src/main/java/com/alex/coalfuels/GlowstoneWireBlock.java

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build mod
        working-directory: coal-fuels-fabric-1.21.11
        run: gradle clean build --stacktrace

      - name: Collect game-ready JAR
        shell: bash
        run: |
          mkdir -p releases
          cp coal-fuels-fabric-1.21.11/build/libs/coal-fuels-1.1.0.jar releases/coal-fuels-1.1.0.jar

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: coal-fuels-1.1.0
          path: releases/coal-fuels-1.1.0.jar

      - name: Commit game-ready JAR to branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/coal-fuels-1.1.0.jar
          git diff --cached --quiet || git commit -m "Build Coal Fuels 1.1.0"
          git push
