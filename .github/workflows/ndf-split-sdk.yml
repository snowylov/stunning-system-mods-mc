name: Split temporary NDF compile environment
on:
  push:
    branches: [ndf-coal-tools-1.21.11-build]
    paths: [.github/workflows/ndf-split-sdk.yml]
permissions:
  contents: read
  actions: read
jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ndf-build-sdk
          run-id: 36763033598
          github-token: ${{ github.token }}
      - run: split -b 400M ndf-build-sdk.tar.gz sdk.part-
      - uses: actions/upload-artifact@v4
        with:
          name: ndf-sdk-part-a
          path: sdk.part-aa
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: ndf-sdk-part-b
          path: sdk.part-ab
          compression-level: 0
          retention-days: 1
