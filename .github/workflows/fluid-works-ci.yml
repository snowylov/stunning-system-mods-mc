name: Build Fluid Works 1.21.11

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "fluid-works-build-input.zip"
      - ".github/workflows/fluid-works-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Extract build input
        run: unzip -q fluid-works-build-input.zip
      - name: Build independent API
        working-directory: fluid-works/required-api
        run: chmod +x gradlew && ./gradlew build --no-daemon
      - name: Install independent API
        run: cp fluid-works/required-api/build/libs/fabric-fluid-api-1.3.0.jar fluid-works/libs/fabric-fluid-api-1.3.0.jar
      - name: Build Fluid Works
        working-directory: fluid-works
        run: chmod +x gradlew && ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: fluid-works-1.21.11
          path: |
            fluid-works/build/libs/fluid-works-*.jar
            fluid-works/required-api/build/libs/fabric-fluid-api-*.jar
