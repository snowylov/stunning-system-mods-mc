name: Temporary client verification assets
on:
  push:
    branches: [ndf-coal-tools-1.21.11-build]
    paths: [.github/workflows/ndf-client-test-assets.yml]
permissions:
  contents: read
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve official 1.21.11 asset index and fonts for local client testing
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,hashlib,concurrent.futures
          from pathlib import Path
          def fetch(url):
            return urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'NDF-build-verification/1.0'}),timeout=60).read()
          manifest=json.loads(fetch('https://piston-meta.mojang.com/mc/game/version_manifest_v2.json'))
          version=next(v for v in manifest['versions'] if v['id']=='1.21.11')
          info=json.loads(fetch(version['url']));meta=info['assetIndex'];data=fetch(meta['url'])
          assert hashlib.sha1(data).hexdigest()==meta['sha1']
          root=Path('test-assets');(root/'indexes').mkdir(parents=True)
          (root/'indexes'/f"{meta['id']}.json").write_bytes(data)
          (root/'INDEX_ID.txt').write_text(meta['id'])
          index=json.loads(data)
          entries=[v for k,v in index['objects'].items() if '/font/' in k or k.endswith('sounds.json') or '/lang/en_' in k]
          def save(v):
            h=v['hash'];b=fetch(f'https://resources.download.minecraft.net/{h[:2]}/{h}')
            assert hashlib.sha1(b).hexdigest()==h
            path=root/'objects'/h[:2]/h;path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(b)
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:list(pool.map(save,entries))
          print('Fetched',len(entries),'font/index resources for private testing')
          PY
      - name: Recover released Universal Tool resources without replacing source code
        shell: bash
        run: |
          mkdir -p released-tools
          curl -fL https://github.com/snowylov/Simple-Fabric-mod-builder/releases/download/v1.4.0/universal-tool-apis-1.4.0-game-ready.jar -o released-tools/universal-tool-apis-1.4.0.jar
          echo '08fe72ecdc8cefcf9a3d46593831a5923d04a795c5a9920ffa1c620c391a16df  released-tools/universal-tool-apis-1.4.0.jar' | sha256sum -c -
          tar -czf client-verification-assets.tar.gz test-assets released-tools
      - uses: actions/upload-artifact@v4
        with:
          name: ndf-client-verification-assets
          path: client-verification-assets.tar.gz
          retention-days: 1
